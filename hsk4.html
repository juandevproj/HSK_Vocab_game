<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HSK4 · Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --red: #a3131f;
        --red-dark: #7c0f19;
        --red-deep: #5c0b13;
        --gold: #d4af37;
        --gold-light: #f2d97d;
        --paper: #fbf3e2;
        --ink: #2b1a12;
        --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        font-family: 'Noto Serif SC', serif;
        color: var(--ink);
        background:
            radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.18), transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.15), transparent 45%),
            linear-gradient(160deg, var(--red-deep), var(--red) 55%, var(--red-dark));
        background-attachment: fixed;
    }

    .card {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: var(--paper);
        border-radius: 18px;
        padding: 46px 26px 36px;
        text-align: center;
        border: 3px solid var(--gold);
        outline: 1px solid rgba(163, 19, 31, 0.4);
        outline-offset: -8px;
        box-shadow: 0 18px 40px var(--shadow), 0 0 0 1px rgba(212, 175, 55, 0.25);
        overflow: hidden;
    }

    .card::before,
    .card::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border: 3px solid var(--gold);
        opacity: 0.9;
    }

    .card::before {
        top: -3px;
        left: -3px;
        border-right: none;
        border-bottom: none;
        border-radius: 10px 0 0 0;
    }

    .card::after {
        bottom: -3px;
        right: -3px;
        border-left: none;
        border-top: none;
        border-radius: 0 0 10px 0;
    }

    /* faint watermark clouds, echoing traditional seal paper */
    .cloud-motif {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        pointer-events: none;
        color: var(--red);
    }

    .seal {
        position: relative;
        margin: 0 auto 8px;
        width: 68px;
        height: 68px;
        border-radius: 10px;
        background: var(--red);
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 34px;
        line-height: 1;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transform: rotate(-3deg);
        border: 1.5px solid rgba(242, 217, 125, 0.6);
    }

    .subtitle {
        position: relative;
        font-size: 12px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--red);
        font-weight: 600;
        margin: 4px 0 26px;
    }

    .brush-headline {
        position: relative;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: clamp(46px, 14vw, 66px);
        color: var(--red);
        line-height: 1.15;
        letter-spacing: 4px;
        margin: 0 0 14px;
    }

    h1 {
        position: relative;
        font-family: 'Noto Serif SC', serif;
        font-weight: 700;
        font-size: clamp(19px, 5vw, 23px);
        line-height: 1.4;
        margin: 0 0 8px;
        color: var(--red-dark);
    }

    .desc {
        position: relative;
        font-size: 13px;
        color: var(--ink);
        opacity: 0.7;
        line-height: 1.6;
        max-width: 300px;
        margin: 0 auto 30px;
    }

    .divider {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 26px;
        color: var(--gold);
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .divider span {
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--red);
        white-space: nowrap;
    }

    .back-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        padding: 14px 28px;
        min-height: 50px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
        color: var(--gold-light);
        font-family: 'Noto Serif SC', serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        border: 1.5px solid var(--gold);
        touch-action: manipulation;
        box-shadow: 0 4px 0 var(--red-deep), 0 6px 14px rgba(0, 0, 0, 0.25);
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    @media (hover: hover) {
        .back-btn:hover {
            background: linear-gradient(180deg, #b5192a 0%, var(--red) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--red-deep), 0 10px 18px rgba(0, 0, 0, 0.3);
        }
    }

    .back-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--red-deep), 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .footer-note {
        margin-top: 26px;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(43, 26, 18, 0.45);
    }

    @media (max-width: 380px) {
        .card { padding: 38px 18px 30px; }
    }
</style>
</head>
<body>

<div class="card">
    <svg class="cloud-motif" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 80 Q60 60 90 70 Q110 55 130 70 Q150 60 160 80 Q145 95 120 90 Q100 100 80 90 Q55 95 40 80 Z" fill="currentColor"/>
        <path d="M240 400 Q265 380 295 392 Q318 375 340 392 Q362 380 372 402 Q355 418 328 412 Q305 424 282 412 Q255 418 240 400 Z" fill="currentColor"/>
        <path d="M280 40 Q300 25 325 35 Q345 22 362 38 Q352 52 332 48 Q315 58 296 48 Q278 55 280 40 Z" fill="currentColor"/>
    </svg>

    <div class="seal">肆</div>
    <div class="subtitle">HSK · 汉语水平考试</div>

    <div class="brush-headline">敬请期待</div>

    <h1>HSK 4 is on its way</h1>
    <p class="desc">This level's vocabulary match is still being carved. Come back soon to test your words.</p>

    <div class="divider"><span>COMING SOON</span></div>

    <a href="index.html" class="back-btn">← Back to HSK</a>

    <div class="footer-note">功夫不负有心人 · Good things take time</div>
</div>

</body>
</html>
