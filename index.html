<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HSK Vocabulary Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --red: #a3131f;
        --red-dark: #7c0f19;
        --red-deep: #5c0b13;
        --gold: #d4af37;
        --gold-light: #f2d97d;
        --paper: #fbf3e2;
        --ink: #2b1a12;
        --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        font-family: 'Noto Serif SC', serif;
        color: var(--ink);
        background:
            radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.18), transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.15), transparent 45%),
            linear-gradient(160deg, var(--red-deep), var(--red) 55%, var(--red-dark));
        background-attachment: fixed;
    }

    .card {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: var(--paper);
        border-radius: 18px;
        padding: 44px 26px 34px;
        text-align: center;
        border: 3px solid var(--gold);
        outline: 1px solid rgba(163, 19, 31, 0.4);
        outline-offset: -8px;
        box-shadow: 0 18px 40px var(--shadow), 0 0 0 1px rgba(212, 175, 55, 0.25);
    }

    /* Corner ornaments, echoing lattice window frames */
    .card::before,
    .card::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border: 3px solid var(--gold);
        opacity: 0.9;
    }

    .card::before {
        top: -3px;
        left: -3px;
        border-right: none;
        border-bottom: none;
        border-radius: 10px 0 0 0;
    }

    .card::after {
        bottom: -3px;
        right: -3px;
        border-left: none;
        border-top: none;
        border-radius: 0 0 10px 0;
    }

    .seal {
        margin: 0 auto 6px;
        width: 54px;
        height: 54px;
        border-radius: 8px;
        background: var(--red);
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 28px;
        line-height: 1;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transform: rotate(-2deg);
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--red);
        font-weight: 600;
        margin: 4px 0 10px;
    }

    .date-line {
        font-size: clamp(16px, 4.5vw, 19px);
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--ink);
        opacity: 0.75;
        margin: 0 0 22px;
    }

    h1 {
        font-family: 'Noto Serif SC', serif;
        font-weight: 700;
        font-size: clamp(20px, 5.5vw, 26px);
        line-height: 1.4;
        margin: 0 0 30px;
        color: var(--red-dark);
    }

    h1 .brush {
        display: block;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: clamp(30px, 8vw, 40px);
        font-weight: 400;
        color: var(--red);
        margin-top: 6px;
        letter-spacing: 2px;
    }

    .levels {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .level-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        padding: 16px;
        min-height: 52px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
        color: var(--gold-light);
        font-family: 'Noto Serif SC', serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        border: 1.5px solid var(--gold);
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 4px 0 var(--red-deep), 0 6px 14px rgba(0, 0, 0, 0.25);
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .level-btn .hanzi {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 20px;
        color: var(--gold-light);
        opacity: 0.9;
    }

    @media (hover: hover) {
        .level-btn:hover {
            background: linear-gradient(180deg, #b5192a 0%, var(--red) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--red-deep), 0 10px 18px rgba(0, 0, 0, 0.3);
        }
    }

    .level-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--red-deep), 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .footer-note {
        margin-top: 28px;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(43, 26, 18, 0.45);
    }

    @media (max-width: 380px) {
        .card { padding: 36px 18px 28px; }
        .level-btn { font-size: 16px; padding: 14px; }
    }

    @media (max-height: 560px) {
        body { align-items: flex-start; }
        .card { margin-top: 12px; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="seal">汉</div>
    <div class="subtitle">HSK · 汉语水平考试</div>
    <div class="date-line" id="chinese-date"></div>

    <h1>
        Let's match with that vocabulary!
        <span class="brush">词汇配对</span>
    </h1>

    <div class="levels">
        <a href="hsk1.html" class="level-btn"><span class="hanzi">一</span> HSK 1</a>
        <a href="hsk2.html" class="level-btn"><span class="hanzi">二</span> HSK 2</a>
        <a href="hsk3.html" class="level-btn"><span class="hanzi">三</span> HSK 3</a>
        <a href="hsk4.html" class="level-btn"><span class="hanzi">四</span> HSK 4</a>
    </div>

    <div class="footer-note">加油 · Choose your level</div>
</div>

<script>
    var weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    var today = new Date();
    var dateText = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日 ' + weekdays[today.getDay()];
    document.getElementById('chinese-date').textContent = dateText;
</script>

</body>
</html>
